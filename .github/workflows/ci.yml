name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer validate --strict --no-check-lock
      - run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: node -e "for (const f of ['src/web/assets/cp/dist/cp.js','src/web/assets/site/dist/site.js']) new (require('vm').Script)(require('fs').readFileSync(f,'utf8'))"
